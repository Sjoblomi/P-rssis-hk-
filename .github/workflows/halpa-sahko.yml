name: Halpa sähkö -ilmoitus

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      testi:
        description: "Lähetä vain testi-ilmoitus"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: halpa-sahko
  cancel-in-progress: false

jobs:
  ilmoita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tarkista hinta ja ilmoita
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GREEN_LIMIT: "6"
          MIN_MINUTES: "60"
          RED_LIMIT: "20"
          RED_MIN_MINUTES: "30"
          TESTI: ${{ github.event.inputs.testi }}
        run: |
          python3 - <<'PY'
          import os, sys, json, urllib.request
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          topic = os.environ.get("NTFY_TOPIC", "").strip()
          g_lim = float(os.environ.get("GREEN_LIMIT", "6"))
          r_lim = float(os.environ.get("RED_LIMIT", "20"))
          g_min = int(os.environ.get("MIN_MINUTES", "60"))
          r_min = int(os.environ.get("RED_MIN_MINUTES", "60"))
          if not topic:
              sys.exit("NTFY_TOPIC puuttuu (Settings > Secrets and variables > Actions)")

          def send(title, msg, tag):
              body = json.dumps({"topic": topic, "title": title, "message": msg, "tags": [tag]}).encode()
              req = urllib.request.Request("https://ntfy.sh/", data=body, headers={"Content-Type": "application/json"})
              urllib.request.urlopen(req, timeout=20).read()

          if os.environ.get("TESTI") == "true":
              send("Testi", "Ilmoitukset toimivat.", "white_check_mark")
              sys.exit(0)

          data = None
          for u in ("https://api.porssisahko.net/v2/latest-prices.json",
                    "https://api.porssisahko.net/v1/latest-prices.json"):
              try:
                  req = urllib.request.Request(u, headers={"User-Agent": "halpa-sahko-ilmoitus"})
                  data = json.load(urllib.request.urlopen(req, timeout=20))["prices"]
                  break
              except Exception as e:
                  print("Haku epäonnistui:", u, e)
          if not data:
              print("Hintoja ei saatu tällä kertaa")
              sys.exit(0)

          def t(x):
              return datetime.fromisoformat(x.replace("Z", "+00:00"))

          sl = sorted(({"s": t(p["startDate"]), "e": t(p["endDate"]), "p": float(p["price"])} for p in data),
                      key=lambda x: x["s"])
          now = datetime.now(timezone.utc)
          cur = next((i for i, x in enumerate(sl) if x["s"] <= now < x["e"]), None)
          if cur is None:
              print("Nykyistä hintaa ei löytynyt")
              sys.exit(0)

          HEL = ZoneInfo("Europe/Helsinki")
          is_g = lambda x: x["p"] <= g_lim
          is_r = lambda x: x["p"] > r_lim
          fmt = lambda v: f"{v:.2f}".replace(".", ",")

          def stretch(i, ok):
              a = i
              while a > 0 and sl[a-1]["e"] == sl[a]["s"] and ok(sl[a-1]):
                  a -= 1
              b = i
              while b + 1 < len(sl) and sl[b+1]["s"] == sl[b]["e"] and ok(sl[b+1]):
                  b += 1
              return a, b

          def mins(a, b):
              return (sl[b]["e"] - sl[a]["s"]).total_seconds() / 60

          def avg(a, b):
              return sum(x["p"] for x in sl[a:b+1]) / (b - a + 1)

          def hm(d):
              return d.astimezone(HEL).strftime("%H:%M")

          def day(d):
              k = (d.astimezone(HEL).date() - datetime.now(HEL).date()).days
              return "tänään" if k == 0 else "huomenna" if k == 1 else d.astimezone(HEL).strftime("%d.%m.")

          def until(b):
              s = "klo " + hm(sl[b]["e"])
              return "vähintään " + s if b == len(sl) - 1 else s

          def next_green(i):
              while i < len(sl):
                  if is_g(sl[i]):
                      a, b = stretch(i, is_g)
                      if mins(a, b) >= g_min:
                          return a, b
                      i = b + 1
                  else:
                      i += 1
              return None

          p = sl[cur]["p"]
          if p <= g_lim:
              kind, (a, b), need = "green", stretch(cur, is_g), g_min
          elif p > r_lim:
              kind, (a, b), need = "red", stretch(cur, is_r), r_min
          else:
              print("Hinta on normaali, ei ilmoitusta")
              sys.exit(0)
          if mins(a, b) < need:
              print("Jakso on liian lyhyt")
              sys.exit(0)

          try:
              raw = open("tila.txt").read().strip()
          except FileNotFoundError:
              raw = ""
          try:
              st = json.loads(raw) if raw.startswith("{") else {"green": raw}
          except ValueError:
              st = {}
          key = sl[a]["s"].isoformat()
          if st.get(kind) == key:
              print("Tästä jaksosta on jo ilmoitettu")
              sys.exit(0)

          if kind == "green":
              send("Halpaa sähköä – hyvä hetki käyttää",
                   f"Hinta nyt {fmt(p)} c/kWh. Halpa jakso kestää {until(b)} (ka. {fmt(avg(a, b))} c).", "zap")
          else:
              msg = f"Hinta nyt {fmt(p)} c/kWh. Kallis jakso kestää {until(b)} (ka. {fmt(avg(a, b))} c)."
              ng = next_green(b + 1)
              if ng:
                  h = mins(*ng) / 60
                  hs = str(int(h)) if h == int(h) else f"{h:.1f}".replace(".", ",")
                  msg += (f" Seuraava halpa jakso alkaa {day(sl[ng[0]]['s'])} klo {hm(sl[ng[0]]['s'])}"
                          f" ({hs} h, ka. {fmt(avg(*ng))} c).")
              else:
                  msg += " Halpaa jaksoa ei näy vielä hinnoissa – odota seuraavien päivien hintoja."
              send("Sähkö on kallista – vältä suurta käyttöä", msg, "warning")

          st[kind] = key
          open("tila.txt", "w").write(json.dumps(st))
          print("Ilmoitus lähetetty")
          PY

      - name: Tallenna tila
        run: |
          if [ -n "$(git status --porcelain tila.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tila.txt
            git commit -m "Päivitä ilmoitustila"
            git push
          fi
